[project]
name = "moneymachine"
version = "0.1.0"
description = "刷钱机 1.0：虚拟钱包 + OKX 实时行情的模拟盘与对照实验框架"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "httpx>=0.27",
    "websockets>=13",
    "anthropic>=1.12.0",
    "tabulate>=0.10.0",
    "lightgbm>=4.7.0",
    "cvxpy>=1.9.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "einops>=0.8.2",
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
]

[project.scripts]
mm = "moneymachine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneymachine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux servers get the CPU-only PyTorch build (the default PyPI wheel pulls ~2.5GB of CUDA).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
